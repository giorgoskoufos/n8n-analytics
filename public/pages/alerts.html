<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - n8n Dashboard</title>
    <script src="../logic/guard.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/open-sans/open-sans.css">
    <link rel="icon" type="image/svg+xml" href="../assets/n8n_db.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<!--
  F-24 §4 · "The logic is fine; the form is not."

  Rebuilt on the shared vocabulary. The four status tiles used to carry four
  arbitrary colours — indigo, grey, amber, rose — with nothing behind the choice
  and no relation to what the numbers mean. They are status tokens now, and only
  where a status is actually being asserted: "undelivered" turns red when it is
  non-zero and stays neutral at zero, because a red 0 is a warning about nothing.
-->
<body>
    <div class="max-w-6xl mx-auto">
        <div id="header-target" data-title="Alerts"
             data-subtitle="Decide what is worth being told about"
             data-crumbs="Dashboard|../index.html, Alerts"></div>

        <div id="alertStats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4"></div>

        <div id="alertPaused" class="hidden text-xs rounded-lg px-3.5 py-2.5 mb-4"
             style="background:color-mix(in srgb, var(--warning-mark) 12%, transparent);
                    border:1px solid color-mix(in srgb, var(--warning-mark) 32%, transparent);
                    color:var(--warning-ink)" role="status"></div>
        <div id="permissionNote" class="hidden text-xs rounded-lg px-3.5 py-2.5 mb-4"
             style="background:var(--surface-1);border:1px solid var(--line);color:var(--ink-3)"></div>

        <!-- ============================== RULES ============================== -->
        <section class="mb-8">
            <div class="card card-clip">
                <div class="card-head">
                    <div>
                        <h2 class="card-title"><i class="fa-solid fa-bell mr-2" style="color:var(--brand)"></i>Rules</h2>
                        <p class="label mt-0.5">what is worth interrupting someone for</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button data-action="runAlertsNow" class="btn btn-sm">
                            <i class="fa-solid fa-play"></i> Evaluate now
                        </button>
                        <button data-action="newAlertRule" class="btn btn-sm btn-primary">
                            <i class="fa-solid fa-plus"></i> New rule
                        </button>
                    </div>
                </div>
                <div class="tbl-wrap custom-scrollbar" style="max-height:60vh">
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th style="width:44px"></th>
                                <th>Rule</th>
                                <th>Condition</th>
                                <th>Watching</th>
                                <th>Goes to</th>
                                <th class="num">Last fired</th>
                                <th class="num" style="width:150px"></th>
                            </tr>
                        </thead>
                        <tbody id="rulesBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ============================ CHANNELS ============================= -->
        <section class="mb-8">
            <div class="card card-clip">
                <div class="card-head">
                    <div>
                        <h2 class="card-title"><i class="fa-solid fa-paper-plane mr-2" style="color:var(--good-ink)"></i>Channels</h2>
                        <p class="label mt-0.5">where an alert goes · test one before you need it</p>
                    </div>
                    <button data-action="newAlertChannel" class="btn btn-sm">
                        <i class="fa-solid fa-plus"></i> New channel
                    </button>
                </div>
                <div class="tbl-wrap custom-scrollbar" style="max-height:50vh">
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th style="width:44px"></th>
                                <th>Channel</th>
                                <th>Type</th>
                                <th class="num">Used by</th>
                                <th>Last result</th>
                                <th class="num" style="width:190px"></th>
                            </tr>
                        </thead>
                        <tbody id="channelsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ============================== EVENTS ============================= -->
        <section class="mb-8">
            <div class="card card-clip">
                <div class="card-head">
                    <div>
                        <h2 class="card-title"><i class="fa-solid fa-clock-rotate-left mr-2" style="color:var(--ink-3)"></i>What has fired</h2>
                        <p class="label mt-0.5">including what was suppressed by a cooldown</p>
                    </div>
                </div>
                <div class="tbl-wrap custom-scrollbar" style="max-height:60vh">
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th style="width:150px">When</th>
                                <th>Rule</th>
                                <th>What happened</th>
                                <th class="num">Delivery</th>
                            </tr>
                        </thead>
                        <tbody id="eventsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <!-- ============================== EDITOR ============================== -->
    <div id="editorModal" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4"
         style="background:rgba(0,0,0,.85);backdrop-filter:blur(6px)"
         role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <div class="card w-full max-w-2xl flex flex-col shadow-2xl max-h-[90vh]">
            <div class="card-head shrink-0">
                <h3 id="editorTitle" class="text-base font-bold" style="color:var(--ink-1)">New rule</h3>
                <button data-action="closeAlertEditor" class="btn btn-sm" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="editorBody" class="flex-1 overflow-auto custom-scrollbar p-5 flex flex-col gap-4"></div>
            <div class="flex justify-between items-center gap-4 px-5 py-4 shrink-0"
                 style="border-top:1px solid var(--line)">
                <p id="editorError" class="text-xs" style="color:var(--critical-ink)" role="alert"></p>
                <div class="flex gap-2 shrink-0">
                    <button data-action="closeAlertEditor" class="btn btn-sm">Cancel</button>
                    <button id="editorSave" data-action="saveAlertEditor" class="btn btn-sm btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../logic/global_functions.js"></script>
    <script src="../logic/ui/components.js"></script>
    <script src="../logic/ui/viz.js"></script>
    <script src="../logic/alerts.js"></script>
    <script src="../logic/header.js"></script>
</body>
</html>
