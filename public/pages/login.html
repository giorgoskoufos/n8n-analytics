<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Login - n8n Analytics</title>
    <link rel="stylesheet" href="/vendor/open-sans/open-sans.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="../assets/n8n_db.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<!--
  `min-h-[100dvh]`, not `h-screen`. `100vh` on a phone is measured against the
  viewport with the browser's own chrome retracted, so a card centred in it sits
  slightly below centre and the page scrolls by the height of the URL bar; and a
  fixed height means the card is clipped rather than scrolled once the keyboard
  is up. A minimum that tracks the viewport does both jobs.
-->

<body class="min-h-[100dvh] flex items-center justify-center p-4 relative overflow-hidden" style="background-color: var(--surface-0)">
    <!-- Blurred workflow background -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute -inset-4 bg-cover bg-center bg-no-repeat"
            style="background-image: url('../assets/n8n_login_bg.png'); filter: blur(3px) brightness(0.4) saturate(1.05);">
        </div>
        <div class="absolute inset-0 bg-black/30"></div>
    </div>

    <div class="bg-n8n-card/90 backdrop-blur-xl border border-line rounded-2xl w-full max-w-md overflow-hidden shadow-2xl p-8 relative z-10">
        <div class="text-center mb-8">
            <div
                class="bg-n8n-primary/20 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-n8n-primary/30 shadow-lg shadow-n8n-primary/5">
                <img src="../assets/n8n_db.png" alt="n8n Dashboard Logo" class="w-12 h-12 object-contain">
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">n8n Analytics</h2>
            <p class="text-ink-2 text-sm">Login with your n8n credentials</p>
        </div>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-ink-2 text-sm font-medium mb-2" for="email">Email</label>
                <input type="email" id="email" required
                    class="w-full bg-black/50 border border-line-2 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-n8n-primary transition-colors"
                    placeholder="name@company.com">
            </div>
            <div class="mb-6">
                <label class="block text-ink-2 text-sm font-medium mb-2" for="password">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-black/50 border border-line-2 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-n8n-primary transition-colors"
                    placeholder="••••••••">
            </div>
            <div id="loginError"
                class="hidden bg-red-900/30 border border-red-900/50 text-red-400 text-sm rounded-lg p-3 mb-6 text-center">
            </div>
            <button type="submit" id="loginBtn"
                class="w-full bg-n8n-primary hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-lg transition-all flex justify-center items-center gap-2">
                <span>Login</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>
    </div>
    <script src="../logic/login.js"></script>
</body>

</html>
