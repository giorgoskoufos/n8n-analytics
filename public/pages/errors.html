<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Error Intelligence - n8n Dashboard</title>
    <script src="../logic/guard.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/open-sans/open-sans.css">
    <script src="/vendor/chart.umd.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="../assets/n8n_db.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<!--
  `class="theme-errors"` is gone from the body.

  It re-declared --n8n-success and --n8n-danger for this page alone, so "an
  error is red" had two definitions that could — and did — drift apart. That is
  F-24's acceptance criterion stated as a bug, and this page was the one place
  it was literally true. This page now renders from the same tokens as the rest
  of the dashboard.
-->
<body>
    <div class="max-w-7xl mx-auto">
        <div id="header-target" data-title="Error Intelligence"
             data-subtitle="Actionable failure diagnostics"
             data-crumbs="Dashboard|../index.html, Error Intelligence"></div>

        <!-- One filter row, above everything it scopes. -->
        <div class="filter-bar mb-6">
            <div id="presetRangeContainer" class="flex items-center gap-1.5" role="group" aria-label="Time range">
                <button id="btn24h" data-action="setErrorRange" data-arg="24" class="chip" aria-pressed="false">24h</button>
                <button id="btn48h" data-action="setErrorRange" data-arg="48" class="chip" aria-pressed="false">48h</button>
                <button id="btn7d" data-action="setErrorRange" data-arg="168" class="chip" aria-pressed="true">7d</button>
                <button id="btn14d" data-action="setErrorRange" data-arg="336" class="chip" aria-pressed="false">14d</button>
                <button id="btn30d" data-action="setErrorRange" data-arg="720" class="chip" aria-pressed="false">30d</button>
            </div>

            <!--
              F-24 §3 · The trigger-type filter this page never had.

              This is not only a UI gap — it is the gap F-02 left. `?mode=` went
              onto four endpoints and not onto getErrorIntelligence, so the
              dashboard could say webhooks fail at 4.03% and schedules at 0.82%
              and could not say which errors were whose.
            -->
            <div class="field">
                <span class="label shrink-0">Trigger</span>
                <select id="errorModeFilter" aria-label="Filter errors by trigger type">
                    <option value="">Any trigger</option>
                    <option value="webhook">Webhook</option>
                    <option value="trigger">Schedule</option>
                    <option value="manual">Manual</option>
                    <option value="error">Error workflow</option>
                    <option value="retry">Retry</option>
                    <option value="integrated">Sub-workflow</option>
                </select>
            </div>

            <div id="customRangeContainer" class="field">
                <span class="label shrink-0">Custom</span>
                <input type="date" id="errorRangeStart" aria-label="Range start">
                <span class="field-sep" aria-hidden="true">—</span>
                <input type="date" id="errorRangeEnd" aria-label="Range end">
            </div>

            <!-- Only shown while something is filtered. A permanently visible
                 "clear filters" is a control that usually does nothing. -->
            <button id="clearErrorFilters" data-action="clearErrorFilters" class="btn btn-sm" hidden>
                <i class="fa-solid fa-xmark"></i> Clear filters
            </button>
        </div>

        <!-- A filtered page that looks unfiltered is the same failure as an
             empty chart that looks like a quiet day. -->
        <p id="errorScopeNote" class="label mb-4" hidden></p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="kpiSection"></div>

        <div class="card card-pad mb-6 flex flex-col" style="min-height:22rem">
            <div class="flex justify-between items-start mb-3 gap-3">
                <div>
                    <h2 class="card-title">Failures over time</h2>
                    <p class="label mt-0.5">errors per day, by category · drag to zoom</p>
                </div>
            </div>
            <div class="flex-1 relative" style="min-height:15rem">
                <canvas id="trendChart"></canvas>
            </div>
            <div id="deployCaption"></div>
            <div id="trendTable"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
            <!-- 26rem is what makes this line up with the table beside it, and
                 the two are only beside each other at `lg`. Stacked on a phone
                 the chart still needs a height (a canvas has no content to be
                 sized by) but a shorter one is plenty. -->
            <div class="card card-pad flex flex-col h-80 lg:h-[26rem]">
                <h2 class="card-title mb-3">Error categories</h2>
                <div class="flex-1 relative min-h-0">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- And the table takes the height its rows need. Fixed at 26rem it
                 was four rows and 250px of empty card, on the screen with the
                 least room to spare. -->
            <div class="lg:col-span-2 card card-clip flex flex-col max-h-[26rem] lg:h-[26rem]">
                <div class="card-head">
                    <h2 class="card-title">Workflow health</h2>
                    <span class="label">success rate over the range</span>
                </div>
                <div class="tbl-wrap custom-scrollbar flex-1" id="healthTableWrap">
                    <table class="tbl">
                        <thead>
                            <tr>
                                <th>Workflow</th>
                                <th class="num">Errors</th>
                                <th class="num">Total runs</th>
                                <th style="width:36%">Health</th>
                            </tr>
                        </thead>
                        <tbody id="healthTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!--
          F-24 §3 · Grouped by category, because that is what this table is.

          It was a flat list with the Category column repeated line by line —
          and a value repeated on every row is the clearest possible signal that
          the value is really a heading. Sections now, with a per-category
          total, collapsible.
        -->
        <div class="card card-clip mb-6" id="errorGroupsCard">
            <div class="card-head">
                <div>
                    <h2 class="card-title">Error groups</h2>
                    <p class="label mt-0.5">deduplicated by fingerprint (F-07)</p>
                </div>
                <span id="groupCount" class="label">0 groups</span>
            </div>
            <div class="tbl-wrap custom-scrollbar" style="max-height:80vh" id="errorGroupsWrap">
                <table class="tbl">
                    <thead>
                        <tr>
                            <th style="width:32px"></th>
                            <th>Failing node</th>
                            <th>Error</th>
                            <th class="num">Occurrences</th>
                            <th class="num">Workflows</th>
                            <th class="num">Status</th>
                        </tr>
                    </thead>
                    <tbody id="errorGroupsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../logic/global_functions.js"></script>
    <script src="../logic/ui/components.js"></script>
    <script src="../logic/ui/viz.js"></script>
    <script src="../logic/error-modal.js"></script>
    <script src="../logic/errors.js"></script>
    <script src="../logic/ui/sync-progress.js"></script>
    <script src="../logic/header.js"></script>
</body>
</html>
