<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Assistant · n8n Dashboard</title>
    <script src="../logic/guard.js"></script>
    <link rel="stylesheet" href="/vendor/open-sans/open-sans.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/n8n_db.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
</head>
<!--
  `data-assistant="off"`: this page IS the conversation, so header.js does not
  also float a panel over it. Everything else about the shell — the rail, the
  sync indicator, the page header — it gets like any other page. It did not have
  them before, which is why it read as a different application.
-->
<body class="p-4 md:p-8" data-assistant="off" data-fill>
    <div class="max-w-3xl mx-auto page-fill">
        <div id="header-target" data-title="Assistant"
             data-subtitle="Answers from this dashboard's own analyses"></div>

        <!-- The switcher, on the page whose whole subject is one thread. -->
        <div class="flex items-center gap-2 mb-3" style="position:relative">
            <button class="assistant-thread" type="button" data-assistant="threads"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="assistantThreads" aria-label="Switch conversation"
                    style="flex:0 1 auto;max-width:24rem">
                <span class="msg-avatar" aria-hidden="true"><i class="fa-solid fa-robot"></i></span>
                <span class="thread-title" id="assistantThreadTitle">Assistant</span>
                <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </button>
            <button class="btn btn-sm" type="button" data-assistant="new">
                <i class="fa-solid fa-pen-to-square"></i> New
            </button>
            <div id="assistantThreads" class="tag-menu" role="listbox"
                 aria-label="Conversations" hidden style="top:calc(100% + 0.25rem);bottom:auto;max-width:24rem"></div>
        </div>

        <!-- `assistant-page` carries the reading size. A full page has room for
             15px and a 420px panel does not; it is one declaration in the CSS
             rather than a flag threaded through every message. -->
        <!--
          `chat-shell` fills what is left of the viewport instead of
          `calc(100dvh - 190px)`.

          190px was the height of everything above this card measured once, on a
          desktop. It is wrong on a phone in both directions and for the same
          reason: the title wraps at 390px, so the card starts lower AND is told
          to be the same height, which pushed the composer off the bottom of a
          short screen; and where the header happened to be shorter than the
          guess, the page ended in a band of empty card. The chain of `flex: 1`
          from `.shell-main` down to here does not have a number in it, so
          there is nothing to be wrong.
        -->
        <div class="card card-pad flex flex-col assistant-page chat-shell">
            <div id="assistantLog" class="assistant-log" role="log"
                 aria-label="Conversation" tabindex="0"
                 style="background:transparent;padding:0 0.25rem 0 0"></div>

            <p id="assistantStatus" class="sr-only" role="status" aria-live="polite"></p>

            <div class="pt-3" style="border-top:1px solid var(--line)">
                <button id="assistantJump" class="assistant-jump" type="button" hidden>
                    <i class="fa-solid fa-arrow-down" aria-hidden="true"></i> New answer
                </button>

                <div id="assistantTagStrip" class="tag-strip mb-1.5" hidden></div>

                <div class="assistant-composer" style="position:relative">
                    <div id="assistantTagMenu" class="tag-menu" role="listbox"
                         aria-label="Tag something" hidden></div>

                    <textarea id="assistantInput" rows="1" maxlength="2000"
                              placeholder="Ask about your workflows…"
                              aria-label="Ask the assistant"
                              aria-autocomplete="list" aria-expanded="false"
                              aria-controls="assistantTagMenu"></textarea>

                    <div class="assistant-composer-row">
                        <button class="assistant-icon-btn" type="button" data-assistant="tools"
                                title="Tools" aria-label="Choose which tools to use"
                                aria-expanded="false">
                            <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        </button>
                        <span id="assistantToolHint" class="assistant-hint"></span>
                        <button id="assistantSend" class="assistant-send" type="button" aria-label="Send">
                            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
                        </button>
                        <button id="assistantStop" class="assistant-stop" type="button" hidden>
                            <i class="fa-solid fa-stop" aria-hidden="true"></i> Stop
                        </button>
                    </div>
                </div>

                <!-- `disclaimer` turns off the uppercase and the 0.12em of tracking
                     below `sm`: this is a footnote, and three lines of caps under
                     the composer is most of what a phone shows below the fold. -->
                <p class="label disclaimer mt-2 text-center">Reads a replica of your n8n data, and can be
                    wrong — open “How this was worked out” to see what it actually measured.</p>
            </div>
        </div>
    </div>

    <!--
      Listed here rather than injected by header.js, which is what happens on
      every other page. This is the one document whose whole purpose is the
      conversation, so its dependency on the conversation's code is not an
      implementation detail worth hiding.
    -->
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="../logic/global_functions.js"></script>
    <script src="../logic/ui/components.js"></script>
    <script src="../logic/chat/store.js"></script>
    <script src="../logic/chat/render.js"></script>
    <script src="../logic/chat/tags.js"></script>
    <script src="../logic/chat-core.js"></script>
    <script src="../logic/chat.js"></script>
    <script src="../logic/header.js"></script>
</body>
</html>
