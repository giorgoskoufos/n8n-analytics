name: Release

# The tag is the release trigger. Pushing v2.0.0 builds the image, publishes it
# and cuts the GitHub Release — one action, not three, so a release cannot be
# half-done.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  # Hardcoded rather than ${{ github.repository }}, because docker-compose.yml
  # ships a pinned `image:` line and the two MUST agree. Deriving this from the
  # repo name means renaming the repo silently publishes to a path that nothing
  # pulls from, and the symptom is a stranger's `docker compose up` failing with
  # an auth error that reads like a bug in the app.
  IMAGE: ghcr.io/giorgoskoufos/n8n-analytics

jobs:
  # The version in package.json is what /api/version reports at runtime. The tag
  # is what the image is labelled and published as. If they disagree, every bug
  # report from that release is wrong about what it is running — so disagreeing
  # is a build failure, checked before anything is published.
  verify:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # A prerelease is a candidate FOR a version, not a different one:
          # v2.0.0-rc1 is tested against package.json 2.0.0, because bumping
          # package.json to 2.0.0-rc1 would make /api/version report a version
          # that never ships, and would need a second bump before release.
          base="${tag%%-*}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$base" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            echo "Bump package.json, commit, then re-tag. Never move a published tag."
            exit 1
          fi
          if [ "$base" != "$tag" ]; then
            echo "$GITHUB_REF_NAME is a prerelease of $pkg — matches."
          else
            echo "$GITHUB_REF_NAME matches package.json ($pkg)."
          fi

  # arm64 matters because a lot of self-hosted n8n runs on a Pi, an Ampere box
  # or an ARM VPS.
  #
  # This was one job building both platforms under QEMU emulation. That does not
  # work here: `npm ci` on the emulated arm64 leg died with
  # "qemu: uncaught target signal 4 (Illegal instruction)", and the run was
  # still going after twenty minutes. Each architecture now builds on its own
  # native runner — `ubuntu-24.04-arm` is free for public repositories — in
  # parallel, so arm64 costs roughly nothing in wall clock.
  #
  # Two runners cannot push the same tag (the second would replace the first),
  # so each pushes by digest only and hands its digest on as an artifact for the
  # `manifest` job to stitch together.
  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here. The tags are applied once, by the manifest job.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate scopes: one cache shared by two architectures thrashes, and
          # an entry from one runner is useless to the other anyway.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures are in the registry by now, but nothing points at them.
  # This is where :2.0.0 and :latest start meaning something.
  manifest:
    name: Publish the multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          # On the index, not the per-architecture children: GHCR reads
          # org.opencontainers.image.source from the index to link the package
          # back to this repository.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # v2.1.3 publishes 2.1.3, 2.1, 2 and latest, so an operator can pin at
          # whatever risk level they want. A prerelease tag (v2.1.0-rc1) is
          # matched by none of the semver patterns and correctly does not move
          # `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # Arrays rather than string interpolation: annotation values contain
          # spaces, and losing the quoting turns one annotation into four
          # arguments that buildx rejects.
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # A failure inside a process substitution does not fail the step, so
          # an empty result here would quietly publish an untagged manifest that
          # nothing can pull. Check rather than trust.
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::error::No tags came out of docker/metadata-action."
            exit 1
          fi

          annotations=()
          while IFS= read -r ann; do
            [ -n "$ann" ] && annotations+=(--annotation "$ann")
          done < <(jq -r '.annotations[]?' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -lt 2 ]; then
            echo "::error::Expected one digest per architecture, found ${#files[@]}."
            exit 1
          fi
          refs=()
          for f in "${files[@]}"; do
            refs+=("$IMAGE@sha256:$f")
          done

          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${refs[@]}"

      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"

  # Proves the published image starts and reports the version this workflow
  # thinks it built — on both architectures, by pulling the real tag on real
  # hardware. The arm64 half is the reason the native runners are worth the
  # extra jobs: emulation could never honestly test it.
  smoke:
    name: Smoke-test ${{ matrix.arch }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Run it and ask for its version
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DASHBOARD_JWT_SECRET=ci-smoke-test-secret-not-a-real-one \
            "$IMAGE:${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/version >/tmp/v.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/v.json
          got="$(jq -r .version /tmp/v.json)"
          if [ "$got" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Image reports version $got, expected ${GITHUB_REF_NAME#v}."
            docker logs smoke
            exit 1
          fi

  release:
    name: GitHub Release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release notes come from CHANGELOG.md, so they cannot drift from it.
      # A version with no section falls back to generated notes rather than
      # failing the release — the tag is already pushed and the image is
      # already published by this point, so refusing here would leave a
      # half-finished release behind.
      - name: Extract the changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # index() rather than a regex: the heading contains [ and ], and
          # getting those escaped correctly through YAML, the shell and awk is
          # three chances to silently match nothing and ship empty notes.
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG section for $version; using generated notes."
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        run: |
          args=(--title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            args+=(--notes-file /tmp/notes.md)
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
